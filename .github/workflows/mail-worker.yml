name: Mail Worker CI

on:
  pull_request:
    paths:
      - "apps/mail/**"
      - ".github/workflows/mail-worker.yml"
      - "bun.lock"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "apps/mail/**"
      - ".github/workflows/mail-worker.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    name: Preview build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Worker
        working-directory: apps/mail
        run: bun run typecheck

      - name: Build preview artifact (no deploy)
        working-directory: apps/mail
        run: bun run preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-worker-preview-${{ github.sha }}
          path: apps/mail/dist
          retention-days: 7
          if-no-files-found: error
