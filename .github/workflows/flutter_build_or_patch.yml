name: Flutter CI/CD - Build Release APK or Generate OTA Patch

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'flutter/apk/**'
      - 'flutter/patch/**'
      - 'flutter/lastpatch/**'
      - 'flutter/ci-logs/**'
      - 'flutter/README.md'
      - 'flutter/worker/**'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose action type to execute manually'
        type: choice
        options:
          - patch
          - native
        default: 'patch'

permissions:
  contents: write

jobs:
  build_or_patch:
    name: Build Native APK or OTA Patch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect Commit Message for {{patch}} or {{native}} Triggers
        id: mode_check
        # Pass the message through `env` instead of pasting it into the shell script: a
        # commit body with quotes, backticks or `$(...)` would otherwise be evaluated by
        # bash and fail the run (exit 127) before any build starts.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MANUAL_CHOICE: ${{ github.event.inputs.action_type }}
        run: |
          echo "Commit message: $COMMIT_MSG"
          echo "Manual choice: $MANUAL_CHOICE"

          if [[ "$COMMIT_MSG" == *"{{native}}"* ]] || [[ "$COMMIT_MSG" == *"[native]"* ]] || [ "$MANUAL_CHOICE" = "native" ]; then
            echo "mode=native" >> $GITHUB_OUTPUT
            echo "TRIGGER: Full native APK rebuild requested."
          elif [[ "$COMMIT_MSG" == *"{{patch}}"* ]] || [[ "$COMMIT_MSG" == *"[patch]"* ]] || [ "$MANUAL_CHOICE" = "patch" ]; then
            echo "mode=patch" >> $GITHUB_OUTPUT
            echo "TRIGGER: OTA patch generation requested via {{patch}}."
          else
            echo "mode=skip" >> $GITHUB_OUTPUT
            echo "TRIGGER: Neither {{patch}} nor {{native}} found. Skipping action."
          fi

      # -------------------------------------------------------------
      # SKIP NOTICE: When neither {{patch}} nor {{native}} is present
      # -------------------------------------------------------------
      - name: Log Skipped Execution
        if: steps.mode_check.outputs.mode == 'skip'
        run: |
          echo "=========================================================="
          echo "⏭️ SKIPPED: Commit message does not contain {{patch}} or {{native}}."
          echo "No compilation or patching performed. CI runner saved."
          echo "To trigger an OTA patch, push with {{patch}}."
          echo "To trigger a full native rebuild, push with {{native}}."
          echo "=========================================================="

      # -------------------------------------------------------------
      # ENVIRONMENT SETUP (Only when NOT skipped)
      # -------------------------------------------------------------
      - name: Setup Java 17
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Cached)
        if: steps.mode_check.outputs.mode != 'skip'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # -------------------------------------------------------------
      # MAXIMUM AGGRESSIVE CACHING (Gradle, Wrappers, Daemon, Pub, Build Outputs, Node Modules, Keys)
      # -------------------------------------------------------------
      - name: Signing Keystore, Baseline & Patcher Keys Cache
        if: steps.mode_check.outputs.mode != 'skip'
        id: baseline_cache
        uses: actions/cache@v4
        with:
          path: |
            flutter/.baseline
            flutter/keys
            flutter/android/app/release.keystore
          key: signing-baseline-${{ runner.os }}-v1
          restore-keys: |
            signing-baseline-${{ runner.os }}-

      - name: Aggressive Gradle & Android Build Cache
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            ~/.android/build-cache
            flutter/android/.gradle
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('flutter/android/gradle/wrapper/gradle-wrapper.properties', 'flutter/android/build.gradle', 'flutter/android/app/build.gradle') }}-${{ github.run_id }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-${{ hashFiles('flutter/android/gradle/wrapper/gradle-wrapper.properties', 'flutter/android/build.gradle', 'flutter/android/app/build.gradle') }}-
            gradle-cache-${{ runner.os }}-

      - name: Flutter Engine, Pub & Build Tree Cache
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.dart_tool
            flutter/build
          key: flutter-build-cache-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            flutter-build-cache-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}-
            flutter-build-cache-${{ runner.os }}-

      - name: Worker Node Modules Cache
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            flutter/worker/node_modules
          key: worker-deps-${{ runner.os }}-${{ hashFiles('flutter/worker/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            worker-deps-${{ runner.os }}-${{ hashFiles('flutter/worker/package-lock.json') }}-
            worker-deps-${{ runner.os }}-

      # -------------------------------------------------------------
      # Ensure Keystores & Reusable Keys are Ready
      # -------------------------------------------------------------
      - name: Ensure Signing Keystore Exists & Reused
        if: steps.mode_check.outputs.mode != 'skip'
        working-directory: flutter
        run: |
          mkdir -p android/app keys .baseline
          if [ -f "android/app/release.keystore" ]; then
            echo "✅ Using existing persistent release keystore."
          else
            echo "Generating persistent release keystore..."
            bash scripts/gen_keystore.sh
          fi

      - name: Install Flutter & Dart Dependencies
        if: steps.mode_check.outputs.mode != 'skip'
        working-directory: flutter
        run: |
          flutter pub get

      - name: Warm Worker Dependencies
        if: steps.mode_check.outputs.mode != 'skip'
        working-directory: flutter/worker
        run: |
          if [ ! -d "node_modules" ]; then
            npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit
          else
            echo "✅ Worker node_modules restored from cache."
          fi

      # =============================================================
      # BRANCH 1: FULL NATIVE BUILD (Triggered by {{native}})
      # =============================================================
      - name: Full Native Release Build
        if: steps.mode_check.outputs.mode == 'native'
        working-directory: flutter
        run: |
          echo "=========================================================="
          echo "🚀 FULL NATIVE BUILD MODE (Triggered by {{native}})"
          echo "=========================================================="

          # 1. Dynamically read version and build number from pubspec.yaml
          APP_VERSION_LINE=$(grep "^version:" pubspec.yaml | head -n 1 | awk '{print $2}')
          APP_VERSION=$(echo "$APP_VERSION_LINE" | cut -d'+' -f1)
          APP_VERSION_CODE=$(echo "$APP_VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$APP_VERSION_CODE" ]; then APP_VERSION_CODE="1"; fi
          echo "Configuring Base Release Version: $APP_VERSION (Build $APP_VERSION_CODE)"

          # 2. Preserve and reuse existing signing keys if available
          mkdir -p keys .baseline apk lastpatch patch
          if [ ! -f "keys/private_key.pem" ]; then
            echo "Initializing fresh Flutter Patcher signing keys..."
            dart run flutter_patcher keys init || true
          else
            echo "✅ Reusing existing Flutter Patcher signing keys."
          fi

          # 3. Build release APK using aggressive Gradle caching
          echo "Compiling signed production release APK (with Gradle build cache)..."
          flutter build apk --release --android-skip-build-dependency-validation

          # 4. Copy release APK to /apk and archive baseline for diffing
          cp build/app/outputs/flutter-apk/app-release.apk apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk .baseline/base-app-release.apk

          # 5. Clean up lastpatch directory and reset manifest (No patches for fresh native release)
          rm -f lastpatch/patch.zip
          cat <<EOF > lastpatch/manifest.json
          {
            "has_update": false,
            "version": "$APP_VERSION",
            "patch_url": "/patch.zip",
            "md5": "",
            "target_version_code": $APP_VERSION_CODE,
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "note": "Fresh native baseline release v$APP_VERSION (build $APP_VERSION_CODE). No patches active."
          }
          EOF

          echo "✅ Release APK v$APP_VERSION (build $APP_VERSION_CODE) compiled and saved to flutter/apk/app-release.apk"

      # =============================================================
      # BRANCH 2: OTA PATCH BUILD (Triggered by {{patch}})
      # =============================================================
      - name: Generate Production OTA Patch
        if: steps.mode_check.outputs.mode == 'patch'
        working-directory: flutter
        run: |
          echo "=========================================================="
          echo "⚡ OTA PATCH MODE (Triggered by {{patch}})"
          echo "=========================================================="

          # Dynamically read version and build number from pubspec.yaml
          APP_VERSION_LINE=$(grep "^version:" pubspec.yaml | head -n 1 | awk '{print $2}')
          APP_VERSION=$(echo "$APP_VERSION_LINE" | cut -d'+' -f1)
          APP_VERSION_CODE=$(echo "$APP_VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$APP_VERSION_CODE" ]; then APP_VERSION_CODE="1"; fi
          echo "Targeting Base Release Version: $APP_VERSION (Build $APP_VERSION_CODE)"

          # Verify baseline exists
          if [ ! -f ".baseline/base-app-release.apk" ] && [ -f "apk/app-release.apk" ]; then
            mkdir -p .baseline
            cp apk/app-release.apk .baseline/base-app-release.apk
          fi

          # Fast incremental compilation of updated Dart bundle (reuses cached Gradle & C++ objects)
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee /tmp/flutter-patch-build.log

          # Compute patch version based on timestamp / commit count
          PATCH_NUM=$(git rev-list --count HEAD)
          PATCH_VER="${APP_VERSION}-h${PATCH_NUM}"
          echo "Generating Patch Version: $PATCH_VER"

          # Extract compiled Dart shared libraries for all target architectures (arm64-v8a and armeabi-v7a)
          mkdir -p dist /tmp/patch_bundle
          echo "Extracting compiled AOT bytecode from release APK..."
          unzip -q -o build/app/outputs/flutter-apk/app-release.apk "lib/*/*.so" -d /tmp/patch_bundle || {
            echo "Fallback extraction for arm64-v8a..."
            mkdir -p /tmp/patch_bundle/lib/arm64-v8a
            unzip -p build/app/outputs/flutter-apk/app-release.apk "lib/arm64-v8a/libapp.so" > /tmp/patch_bundle/lib/arm64-v8a/libapp.so
          }

          # Package patch archive
          cd /tmp/patch_bundle && zip -r "$GITHUB_WORKSPACE/flutter/dist/patch.zip" lib/ && cd -

          # Calculate MD5 checksum of the generated patch
          PATCH_MD5=$(md5sum dist/patch.zip | cut -d' ' -f1)
          echo "Generated Patch MD5: $PATCH_MD5"

          # Archive to /patch/<version>/
          ARCHIVE_DIR="patch/${PATCH_VER}"
          mkdir -p "$ARCHIVE_DIR" lastpatch
          cp dist/patch.zip "$ARCHIVE_DIR/patch.zip"

          # Update /lastpatch directory (production static host target)
          cp dist/patch.zip lastpatch/patch.zip

          cat <<EOF > lastpatch/manifest.json
          {
            "has_update": true,
            "version": "${PATCH_VER}",
            "patch_url": "/patch.zip",
            "md5": "${PATCH_MD5}",
            "target_version_code": ${APP_VERSION_CODE},
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}"
          }
          EOF

          cp lastpatch/manifest.json "$ARCHIVE_DIR/manifest.json"
          echo "✅ Patch $PATCH_VER generated and saved to flutter/lastpatch"

      # -------------------------------------------------------------
      # Failure log capture: temporarily commits the build log so the
      # failure can be inspected without an authenticated Actions log.
      # -------------------------------------------------------------
      - name: Capture Patch Build Failure Log
        if: failure()
        run: |
          mkdir -p flutter/ci-logs
          cp /tmp/flutter-patch-build.log flutter/ci-logs/patch-build.log 2>/dev/null || true
          if [ -s flutter/ci-logs/patch-build.log ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f flutter/ci-logs/patch-build.log
            git commit -m "ci(flutter): capture patch build failure log [skip ci]" || true
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      # -------------------------------------------------------------
      # Commit artifacts, keystores & keys back to GitHub repository
      # -------------------------------------------------------------
      - name: Commit & Push Release Artifacts, Keystores & Keys to GitHub
        if: steps.mode_check.outputs.mode != 'skip'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all flutter release artifacts, baseline, and keys
          git add -f \
            flutter/apk/ \
            flutter/patch/ \
            flutter/lastpatch/ \
            flutter/.baseline/ \
            flutter/keys/ \
            flutter/android/app/release.keystore 2>/dev/null || true

          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No artifact or key changes to commit."
          else
            git commit -m "ci(flutter): [skip ci] auto-published updated apk/patch/keys artifacts"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
