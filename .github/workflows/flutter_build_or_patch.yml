name: Flutter CI/CD - Build Release APK or Generate OTA Patch

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'flutter/apk/**'
      - 'flutter/patch/**'
      - 'flutter/lastpatch/**'
      - 'flutter/README.md'
      - 'flutter/worker/**'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose action type to execute manually'
        type: choice
        options:
          - patch
          - native
        default: 'patch'

permissions:
  contents: write

jobs:
  build_or_patch:
    name: Build Native APK or OTA Patch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect Commit Message for {{patch}} or {{native}} Triggers
        id: mode_check
        # Pass the message through `env` instead of pasting it into the shell script: a
        # commit body with quotes, backticks or `$(...)` would otherwise be evaluated by
        # bash and fail the run (exit 127) before any build starts.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MANUAL_CHOICE: ${{ github.event.inputs.action_type }}
        run: |
          echo "Commit message: $COMMIT_MSG"
          echo "Manual choice: $MANUAL_CHOICE"

          if [[ "$COMMIT_MSG" == *"{{native}}"* ]] || [[ "$COMMIT_MSG" == *"[native]"* ]] || [ "$MANUAL_CHOICE" = "native" ]; then
            echo "mode=native" >> $GITHUB_OUTPUT
            echo "TRIGGER: Full native APK rebuild requested."
          elif [[ "$COMMIT_MSG" == *"{{patch}}"* ]] || [[ "$COMMIT_MSG" == *"[patch]"* ]] || [ "$MANUAL_CHOICE" = "patch" ]; then
            echo "mode=patch" >> $GITHUB_OUTPUT
            echo "TRIGGER: OTA patch generation requested via {{patch}}."
          else
            echo "mode=skip" >> $GITHUB_OUTPUT
            echo "TRIGGER: Neither {{patch}} nor {{native}} found. Skipping action."
          fi

      # -------------------------------------------------------------
      # SKIP NOTICE: When neither {{patch}} nor {{native}} is present
      # -------------------------------------------------------------
      - name: Log Skipped Execution
        if: steps.mode_check.outputs.mode == 'skip'
        run: |
          echo "=========================================================="
          echo "⏭️ SKIPPED: Commit message does not contain {{patch}} or {{native}}."
          echo "No compilation or patching performed. CI runner saved."
          echo "To trigger an OTA patch, push with {{patch}}."
          echo "To trigger a full native rebuild, push with {{native}}."
          echo "=========================================================="

      # -------------------------------------------------------------
      # ENVIRONMENT SETUP (Only when NOT skipped)
      # -------------------------------------------------------------
      - name: Setup Java 17
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Cached)
        if: steps.mode_check.outputs.mode != 'skip'
        uses: subosito/flutter-action@v2
        with:
          # Pinned: this project's Android config (AGP 8.11.1) is verified
          # against 3.47.9. Newer stable releases ship a Flutter Gradle plugin
          # compiled against AGP 9.1.1 and crash before their version check.
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true
          cache-key: "flutter-3.47.9-:os:-:arch:-:hash:"

      # -------------------------------------------------------------
      # MAXIMUM AGGRESSIVE CACHING (Gradle, Wrappers, Daemon, Pub, Build Outputs, Node Modules, Keys)
      # -------------------------------------------------------------
      - name: Signing Keystore, Baseline & Patcher Keys Cache
        if: steps.mode_check.outputs.mode != 'skip'
        id: baseline_cache
        uses: actions/cache@v4
        with:
          path: |
            flutter/.baseline
            flutter/.flutter_patcher
            flutter/keys
            flutter/android/app/release.keystore
          key: signing-baseline-${{ runner.os }}-v1
          restore-keys: |
            signing-baseline-${{ runner.os }}-

      - name: Aggressive Gradle & Android Build Cache
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            ~/.android/build-cache
            flutter/android/.gradle
          key: gradle-cache-v2-${{ runner.os }}-${{ hashFiles('flutter/android/gradle/wrapper/gradle-wrapper.properties', 'flutter/android/build.gradle', 'flutter/android/app/build.gradle', 'flutter/android/settings.gradle') }}-${{ github.run_id }}
          restore-keys: |
            gradle-cache-v2-${{ runner.os }}-${{ hashFiles('flutter/android/gradle/wrapper/gradle-wrapper.properties', 'flutter/android/build.gradle', 'flutter/android/app/build.gradle', 'flutter/android/settings.gradle') }}-
            gradle-cache-v2-${{ runner.os }}-

      - name: Flutter Engine, Pub & Build Tree Cache
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.dart_tool
            flutter/build
          key: flutter-build-cache-v2-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            flutter-build-cache-v2-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}-
            flutter-build-cache-v2-${{ runner.os }}-

      - name: Worker Node Modules Cache
        if: steps.mode_check.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            flutter/worker/node_modules
          key: worker-deps-${{ runner.os }}-${{ hashFiles('flutter/worker/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            worker-deps-${{ runner.os }}-${{ hashFiles('flutter/worker/package-lock.json') }}-
            worker-deps-${{ runner.os }}-

      # -------------------------------------------------------------
      # Ensure Keystores & Reusable Keys are Ready
      # -------------------------------------------------------------
      - name: Ensure Signing Keystore Exists & Reused
        if: steps.mode_check.outputs.mode != 'skip'
        working-directory: flutter
        run: |
          mkdir -p android/app keys .baseline
          if [ -f "android/app/release.keystore" ]; then
            echo "✅ Using existing persistent release keystore."
          else
            echo "Generating persistent release keystore..."
            bash scripts/gen_keystore.sh
          fi

      - name: Install Flutter & Dart Dependencies
        if: steps.mode_check.outputs.mode != 'skip'
        working-directory: flutter
        run: |
          flutter pub get

      - name: Warm Worker Dependencies
        if: steps.mode_check.outputs.mode != 'skip'
        working-directory: flutter/worker
        run: |
          if [ ! -d "node_modules" ]; then
            npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit
          else
            echo "✅ Worker node_modules restored from cache."
          fi

      # =============================================================
      # BRANCH 1: FULL NATIVE BUILD (Triggered by {{native}})
      # =============================================================
      - name: Full Native Release Build
        if: steps.mode_check.outputs.mode == 'native'
        working-directory: flutter
        run: |
          echo "=========================================================="
          echo "🚀 FULL NATIVE BUILD MODE (Triggered by {{native}})"
          echo "=========================================================="

          # 1. Dynamically read version and build number from pubspec.yaml
          APP_VERSION_LINE=$(grep "^version:" pubspec.yaml | head -n 1 | awk '{print $2}')
          APP_VERSION=$(echo "$APP_VERSION_LINE" | cut -d'+' -f1)
          APP_VERSION_CODE=$(echo "$APP_VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$APP_VERSION_CODE" ]; then APP_VERSION_CODE="1"; fi
          echo "Configuring Base Release Version: $APP_VERSION (Build $APP_VERSION_CODE)"

          # 2. Prepare directories for baseline, apk, and patches
          mkdir -p keys .baseline apk lastpatch patch dist

          # 3. Build release APK using flutter_patcher dedicated command (or fallback to flutter build apk)
          echo "Compiling signed production release APK with flutter_patcher build..."
          rm -rf dist/release
          dart run flutter_patcher build android --strategy so --out dist/release --version-code "$APP_VERSION_CODE" || flutter build apk --release --build-name="$APP_VERSION" --build-number="$APP_VERSION_CODE" --android-skip-build-dependency-validation

          # 4. Copy release APK to /apk, /lastpatch and archive baseline for diffing
          APK_PRODUCED=$(find dist/release build/app/outputs -name "app-release.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PRODUCED" ]; then
            echo "Copying compiled release APK from $APK_PRODUCED..."
            cp "$APK_PRODUCED" apk/app-release.apk
            cp "$APK_PRODUCED" lastpatch/app-release.apk
            cp "$APK_PRODUCED" .baseline/base-app-release.apk
          else
            echo "❌ ERROR: No release APK found!"
            exit 1
          fi

          # 5. Clean up lastpatch directory and reset manifest (No patches for fresh native release)
          rm -f lastpatch/patch.zip
          cat <<EOF > lastpatch/manifest.json
          {
            "has_update": false,
            "version": "$APP_VERSION",
            "patch_url": "/patch.zip",
            "md5": "",
            "target_version_code": $APP_VERSION_CODE,
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "note": "Fresh native baseline release v$APP_VERSION (build $APP_VERSION_CODE). No patches active."
          }
          EOF

          echo "✅ Release APK v$APP_VERSION (build $APP_VERSION_CODE) compiled and saved to flutter/apk/app-release.apk"

      # =============================================================
      # BRANCH 2: OTA PATCH BUILD (Triggered by {{patch}})
      # =============================================================
      - name: Generate Production OTA Patch
        if: steps.mode_check.outputs.mode == 'patch'
        working-directory: flutter
        run: |
          echo "=========================================================="
          echo "⚡ OTA PATCH MODE (Triggered by {{patch}})"
          echo "=========================================================="

          # Dynamically read version and build number from pubspec.yaml
          APP_VERSION_LINE=$(grep "^version:" pubspec.yaml | head -n 1 | awk '{print $2}')
          APP_VERSION=$(echo "$APP_VERSION_LINE" | cut -d'+' -f1)
          APP_VERSION_CODE=$(echo "$APP_VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$APP_VERSION_CODE" ]; then APP_VERSION_CODE="1"; fi
          echo "Targeting Base Release Version: $APP_VERSION (Build $APP_VERSION_CODE)"

          # Verify baseline exists
          if [ ! -f ".baseline/base-app-release.apk" ] && [ -f "apk/app-release.apk" ]; then
            mkdir -p .baseline
            cp apk/app-release.apk .baseline/base-app-release.apk
          fi

          # Use official flutter_patcher CLI to build patch
          mkdir -p dist
          rm -rf dist/patch
          echo "Packaging patch archive with flutter_patcher patch android..."
          dart run flutter_patcher patch android --version-code "$APP_VERSION_CODE" --out dist/patch || true

          # Locate generated patch file (.fptc or .zip)
          PATCH_FILE=$(find dist/patch -name "*.fptc" -o -name "patch.zip" 2>/dev/null | head -n 1)

          # Fallback if baseline was not found or patch android did not produce a file
          if [ -z "$PATCH_FILE" ]; then
            echo "Falling back: compiling incremental bundle with flutter build apk..."
            flutter build apk --release --build-name="$APP_VERSION" --build-number="$APP_VERSION_CODE" --android-skip-build-dependency-validation
            dart run flutter_patcher patch android --version-code "$APP_VERSION_CODE" --out dist/patch || true
            PATCH_FILE=$(find dist/patch -name "*.fptc" -o -name "patch.zip" 2>/dev/null | head -n 1)
          fi

          if [ -n "$PATCH_FILE" ]; then
            PATCH_NAME=$(basename "$PATCH_FILE")
            echo "Generated patch artifact: $PATCH_NAME"
            PATCH_MD5=$(md5sum "$PATCH_FILE" | cut -d' ' -f1)
            echo "Generated Patch MD5: $PATCH_MD5"

            # Archive to /patch/<version>/
            ARCHIVE_DIR="patch/${PATCH_VER}"
            mkdir -p "$ARCHIVE_DIR" lastpatch
            cp "$PATCH_FILE" "$ARCHIVE_DIR/patch.zip"
            cp "$PATCH_FILE" "$ARCHIVE_DIR/$PATCH_NAME"
            cp "$PATCH_FILE" lastpatch/patch.zip
            cp "$PATCH_FILE" "lastpatch/$PATCH_NAME"

            cat <<EOF > lastpatch/manifest.json
          {
            "has_update": true,
            "version": "${PATCH_VER}",
            "patch_url": "/$PATCH_NAME",
            "md5": "${PATCH_MD5}",
            "target_version_code": ${APP_VERSION_CODE},
            "targetVersionCode": ${APP_VERSION_CODE},
            "schemaVersion": 2,
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}"
          }
          EOF

            cp lastpatch/manifest.json "$ARCHIVE_DIR/manifest.json"
            echo "✅ Patch $PATCH_VER generated ($PATCH_NAME) and saved to flutter/lastpatch"
          else
            echo "❌ ERROR: Failed to produce patch file!"
            exit 1
          fi

      # -------------------------------------------------------------
      # Upload Release APK as GitHub Artifact (Direct download from GitHub Actions Web UI)
      # -------------------------------------------------------------
      - name: Upload Release APK as GitHub Artifact
        if: steps.mode_check.outputs.mode == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: onlyorders-release-apk
          path: flutter/apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      # -------------------------------------------------------------
      # Commit artifacts, keystores & keys back to GitHub repository
      # -------------------------------------------------------------
      - name: Commit & Push Release Artifacts, Keystores & Keys to GitHub
        if: steps.mode_check.outputs.mode != 'skip'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all flutter release artifacts, baseline, and keys safely
          for target in flutter/apk flutter/patch flutter/lastpatch flutter/.baseline flutter/.flutter_patcher flutter/keys flutter/android/app/release.keystore; do
            if [ -e "$target" ]; then
              git add -f "$target"
            fi
          done

          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No artifact or key changes to commit."
          else
            git commit -m "ci(flutter): [skip ci] auto-published updated apk/patch/keys artifacts"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
