name: onlyorders
description: "OnlyOrders Merchant App - AI Auto-Reply E-commerce & Omnichannel Sales"
publish_to: "none"
version: 1.0.12+13

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_patcher: ^0.1.4
  http: ^1.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.2
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  url_launcher: ^6.2.4
  app_links: ^7.2.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/version.json
    - assets/icon-96.png
    - assets/icon-192.png
    - assets/onlyorders-logo.png
    - assets/onlyorders-logo-dark.png
    - assets/logo.png
